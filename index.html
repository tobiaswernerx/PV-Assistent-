<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PV Assistent</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a8f41">

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 16px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    margin-top:0;
}

.info{
    background:#eef6ff;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#f7f7f7;
    border-radius:12px;
    min-height:120px;
}

.good{
    color:#0a8f41;
    font-weight:bold;
}

.bad{
    color:#d10000;
    font-weight:bold;
}

.small{
    color:#666;
    font-size:14px;
}

.loading{
    color:#555;
}

</style>

</head>

<body>

<div class="card">

<h1>☀️ PV Assistent</h1>

<div class="info">
PV: 24,4 kWp<br>
Speicher: 16 kWh<br>
Ausrichtung: Süd 50°<br>
Standort: 97618
</div>

<div id="output" class="result">
<span class="loading">
Lade Prognose...
</span>
</div>

</div>

<script>

const PV_POWER = 24.4;
const BATTERY_SIZE = 16;
const SYSTEM_EFFICIENCY = 0.82;

async function analyse(){

const output =
document.getElementById("output");

output.innerHTML =
"Berechne Prognose...";

try{

const response = await fetch(
"https://api.open-meteo.com/v1/forecast?latitude=50.32&longitude=10.22&hourly=shortwave_radiation&forecast_days=2&timezone=Europe%2FBerlin"
);

const data =
await response.json();

const times =
data.hourly.time;

const radiation =
data.hourly.shortwave_radiation;

let dayMap = {};

for(let i=0;i<times.length;i++){

    const date =
    new Date(times[i]);

    const key =
    date.getFullYear() + "-" +
    String(date.getMonth()+1).padStart(2,"0") + "-" +
    String(date.getDate()).padStart(2,"0");

    if(!dayMap[key]){
        dayMap[key]=[];
    }

    dayMap[key].push({
        hour:date.getHours(),
        radiation:radiation[i]
    });

}

const dayKeys =
Object.keys(dayMap);

function evaluateDay(hours){

    let battery = 0;

    let fullHour = null;

    let totalPv = 0;

    let hourlyData = [];

    for(const item of hours){

        const pvKwh =
        (item.radiation / 1000)
        *
        PV_POWER
        *
        SYSTEM_EFFICIENCY;

        totalPv += pvKwh;

        if(fullHour === null){

            battery += pvKwh;

            if(
                battery >= BATTERY_SIZE
            ){

                battery =
                BATTERY_SIZE;

                fullHour =
                item.hour;
            }
        }

        hourlyData.push({

            hour:item.hour,

            surplus:
            fullHour !== null
            ? pvKwh
            : 0

        });

    }

    let bestStart = null;
    let bestWindow = 0;

    for(
        let i=0;
        i<hourlyData.length-3;
        i++
    ){

        let sum = 0;

        for(
            let j=0;
            j<4;
            j++
        ){

            sum +=
            hourlyData[i+j]
            .surplus;

        }

        if(sum > bestWindow){

            bestWindow =
            sum;

            bestStart =
            hourlyData[i].hour;

        }

    }

    return {

        totalPv,

        fullHour,

        bestWindow,

        bestStart

    };

}

const today =
evaluateDay(
dayMap[dayKeys[0]]
);

const tomorrow =
evaluateDay(
dayMap[dayKeys[1]]
);

if(
today.fullHour === null &&
tomorrow.fullHour === null
){

output.innerHTML =

`
<div class="bad">
⚪ Maschine egal
</div>

<br>

Der 16-kWh-Speicher
wird laut Prognose
weder heute noch morgen
vollständig geladen.

<br><br>

Heute Prognose:
<b>
${today.totalPv.toFixed(1)}
kWh
</b>

<br>

Morgen Prognose:
<b>
${tomorrow.totalPv.toFixed(1)}
kWh
</b>
`;

return;

}

const winner =
today.bestWindow >
tomorrow.bestWindow
? {
label:"Heute",
...today
}
: {
label:"Morgen",
...tomorrow
};

output.innerHTML =

`
<div class="good">
✅ Empfehlung
</div>

<br>

<b>
${winner.label}
</b>

<br><br>

Maschinen starten zwischen

<br><br>

<b>
${winner.bestStart}:00 Uhr
–
${winner.bestStart + 4}:00 Uhr
</b>

<br><br>

Speicher vermutlich voll ab

<br>

<b>
${winner.fullHour}:00 Uhr
</b>

<br><br>

Prognostizierter Überschuss
in diesem Zeitraum

<br>

<b>
${winner.bestWindow.toFixed(1)}
kWh
</b>

<br><br>

<div class="small">

Heute:
${today.totalPv.toFixed(1)}
kWh

<br>

Morgen:
${tomorrow.totalPv.toFixed(1)}
kWh

</div>

`;

}
catch(error){

console.error(error);

output.innerHTML =

`
<div class="bad">
Fehler beim Abruf der Wetterdaten
</div>
`;

}

}

analyse();

</script>

</body>
</html>
